[workspace]
resolver = "2"
members = [
    "crates/profanite-core",
    "crates/profanite-node",
    "crates/profanite-py",
    "crates/profanite-semantic",
    "bench",
]
# profanite-py uses pyo3's `extension-module` feature, which deliberately
# leaves libpython symbols unresolved at link time (they're provided by the
# host Python at runtime). That makes it fail `cargo test --workspace`
# anywhere libpython isn't directly available (notably macOS CI). Build
# the Python crate only via `maturin` / explicit `cargo build -p profanite-py`.
default-members = [
    "crates/profanite-core",
    "crates/profanite-node",
    "crates/profanite-semantic",
    "bench",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"
repository = "https://github.com/Beatsphere/profanite"
description = "Kryptonite for Profanities — lightweight, obfuscation-resistant profanity filter"
authors = ["Nishchay Sinha"]

[workspace.dependencies]
profanite-core = { path = "crates/profanite-core", version = "0.1.0" }
aho-corasick = "1.1"
unicode-normalization = "0.1"
thiserror = "1.0"
