[package]
name = "profanite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
authors.workspace = true
keywords = ["profanity", "filter", "censor", "moderation", "unicode"]
categories = ["text-processing"]
readme = "README.md"
# LDNOOBW data is CC0 and safe to redistribute; ship it in the published
# package so downstream users don't need to fetch it separately at build.
include = [
    "src/**/*.rs",
    "build.rs",
    "data/**/*.txt",
    "README.md",
]

[features]
default = ["lang-en"]
lang-en = []
lang-es = []
lang-hi = []
lang-fr = []
lang-de = []
all-langs = ["lang-en", "lang-es", "lang-hi", "lang-fr", "lang-de"]

[dependencies]
aho-corasick = { workspace = true }
unicode-normalization = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scan"
harness = false
