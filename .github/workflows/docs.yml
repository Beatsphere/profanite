name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readme-sync:
    name: README.md matches template + examples + bench snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # bench/STATS.md is committed and regenerated locally via
      # `cargo run -p profanite-bench --features semantic -- snapshot`.
      # CI only checks that README.md is consistent with the committed
      # STATS.md + template + examples — it does NOT re-run the bench.
      - name: Check README.md matches template + committed stats
        run: python3 scripts/sync-readme.py --check
